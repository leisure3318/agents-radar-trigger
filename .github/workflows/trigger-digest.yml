name: Trigger agents-radar daily digest

# GitHub disables `schedule` events on forked repositories, so the cron in
# leisure3318/agents-radar/.github/workflows/daily-digest.yml never fires.
# This standalone (non-fork) repo runs its own schedule and dispatches the
# digest workflow via the REST API instead.
on:
  schedule:
    # 23:37 UTC ≈ 07:37 CST — picked an off-the-hour minute to dodge the
    # congestion delay GitHub applies to round cron times like 00:00 UTC.
    - cron: "37 23 * * *"
  workflow_dispatch:

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger daily-digest workflow_dispatch on agents-radar
        env:
          GH_TOKEN: ${{ secrets.DIGEST_REPO_PAT }}
        run: |
          gh workflow run daily-digest.yml --repo leisure3318/agents-radar
